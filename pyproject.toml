[project]
name = "glassbox-harness"
version = "0.1.0"
description = "Glassbox — a mini coding-kata agent harness with a live trace UI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
packages = ["harness", "harness.providers", "harness.tools", "harness.sandbox", "harness.verification", "harness.tracing", "api"]
